version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: yim-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./yim_gaming_backup.sql:/docker-entrypoint-initdb.d/restore.sql:ro

volumes:
  postgres_data:
